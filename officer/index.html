<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Officer Dashboard — AG GAER Appointments</title>
<style>
  :root{
    --navy:#2F3080; --navy-dark:#232566; --gold:#EEDF10;
    --lavender:#B4B8DA; --lavender-light:#E7E8F3; --white:#FFFFFF; --ink:#1A1A1A;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:"Calibri","Segoe UI",system-ui,sans-serif; color:var(--ink);
    background:linear-gradient(180deg,var(--navy) 0%, var(--navy) 130px, var(--lavender-light) 130px, var(--lavender-light) 100%);
    padding:0 16px 60px;
  }
  h1,h2,h3{ font-family:"Cambria","Georgia",serif; margin:0; }
  .wrap{ max-width:640px; margin:0 auto; }

  header.brand{ text-align:center; padding:26px 0 14px; color:var(--white); }
  header.brand .region{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  header.brand h1{ font-size:20px; font-weight:700; margin-top:2px; }

  .card{ background:var(--white); border-radius:var(--radius); margin-top:16px; padding:22px; box-shadow:0 6px 20px rgba(35,37,102,0.1); }

  /* LOGIN */
  #loginCard label{ display:block; font-size:13px; font-weight:700; color:var(--navy); margin:14px 0 5px; }
  #loginCard select, #loginCard input{
    width:100%; padding:11px 12px; font-size:15px; border:1.5px solid var(--lavender); border-radius:8px; font-family:inherit;
  }
  #loginCard select:focus, #loginCard input:focus{ outline:none; border-color:var(--navy); }
  button.primary{ background:var(--navy); color:var(--white); border:none; padding:13px; border-radius:8px; font-weight:700; font-size:15px; cursor:pointer; width:100%; margin-top:18px; }
  button.primary:hover{ background:var(--navy-dark); }
  button.primary:disabled{ background:#ccc; cursor:not-allowed; }
  button.secondary{ background:var(--lavender-light); color:var(--navy); border:none; padding:9px 14px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; }
  button.danger{ background:#FDECEC; color:#9B2C2C; border:none; padding:9px 14px; border-radius:8px; font-weight:700; font-size:13px; cursor:pointer; }
  .error{ background:#FDECEC; color:#9B2C2C; border-radius:8px; padding:10px 12px; font-size:13.5px; margin-top:14px; }

  /* TOPBAR */
  #topbar{ display:none; justify-content:space-between; align-items:center; margin-top:18px; color:var(--white); }
  #topbar .who{ font-family:"Cambria",serif; font-weight:700; font-size:17px; }
  #topbar .title{ font-size:12px; opacity:.85; }

  /* SECTION HEADERS */
  .section-title{ font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--navy); font-weight:700; margin:22px 4px 10px; }
  #dashboard{ display:none; }

  .appt{ background:var(--white); border-radius:var(--radius); padding:16px 18px; margin-bottom:10px; box-shadow:0 4px 14px rgba(35,37,102,0.07); }
  .appt .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .appt .when{ font-family:"Cambria",serif; font-weight:700; color:var(--navy); font-size:16px; }
  .badge{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
  .badge.pending{ background:#FFF3CD; color:#8A6D00; }
  .badge.confirmed{ background:#DDF3E4; color:#1F7A3F; }
  .badge.cancelled{ background:#FDECEC; color:#9B2C2C; }
  .badge.completed{ background:var(--lavender-light); color:var(--navy); }
  .badge.waiting{ background:#E7E8F3; color:#2F3080; }
  .badge.called{ background:#DDF3E4; color:#1F7A3F; }
  .badge.held{ background:#FDE9D0; color:#9A5B00; }
  .badge.no_show{ background:#FDECEC; color:#9B2C2C; }
  .queue-alert{ border:2px solid var(--gold); }
  .info{ background:var(--lavender-light); color:var(--navy); border-radius:8px; padding:10px 12px; font-size:13.5px; margin-top:14px; }

  .tabs{ display:flex; gap:8px; margin-top:20px; }
  .tab{ background:var(--lavender-light); color:var(--navy); border:none; padding:9px 16px; border-radius:8px; font-weight:700; font-size:13.5px; cursor:pointer; }
  .tab.active{ background:var(--navy); color:var(--white); }

  .note-thread{ max-height:180px; overflow-y:auto; margin-top:10px; padding:8px; background:var(--lavender-light); border-radius:8px; }
  .note-line{ font-size:12.5px; margin-bottom:6px; }
  .note-line b{ color:var(--navy); }
  .note-input-row{ display:flex; gap:8px; margin-top:8px; }
  .note-input-row input{ flex:1; padding:8px 10px; font-size:13px; border:1.5px solid var(--lavender); border-radius:8px; }
  .note-input-row button{ padding:8px 12px; }

  /* DRAMATIC ALERT — forces acknowledgment, can't be missed */
  .alert-overlay{
    display:none; position:fixed; inset:0; background:rgba(20,20,50,.75);
    align-items:center; justify-content:center; padding:20px; z-index:1000;
    animation:alertFadeIn .2s ease-out;
  }
  .alert-overlay.show{ display:flex; }
  @keyframes alertFadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes alertPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.02);} }
  .alert-card{
    background:var(--white); border-radius:14px; padding:32px 26px; width:100%; max-width:400px;
    text-align:center; border:4px solid var(--gold); box-shadow:0 20px 60px rgba(0,0,0,.4);
    animation:alertPulse 1s ease-in-out infinite;
  }
  .alert-card .icon{ font-size:40px; margin-bottom:10px; }
  .alert-card h2{ font-size:20px; color:var(--navy); margin-bottom:8px; }
  .alert-card .detail{ font-size:15px; color:#333; margin-bottom:20px; }

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:var(--white); padding:14px 20px; border-radius:10px;
    font-size:14px; font-weight:700; z-index:1000; box-shadow:0 8px 24px rgba(0,0,0,.3);
    max-width:90vw; text-align:center;
  }
  .appt .who{ margin-top:8px; font-size:14.5px; font-weight:700; }
  .appt .meta{ font-size:13px; color:#555; margin-top:2px; }
  .appt .purpose{ font-size:13.5px; margin-top:8px; line-height:1.5; }
  .appt .proxy-tag{ margin-top:8px; font-size:12px; color:var(--navy); background:var(--lavender-light); display:inline-block; padding:4px 10px; border-radius:6px; }
  .appt .btns{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .empty-note{ text-align:center; color:#666; font-size:13.5px; padding:14px; }

  /* MODAL */
  .modal-bg{ display:none; position:fixed; inset:0; background:rgba(26,26,26,.5); align-items:center; justify-content:center; padding:16px; z-index:100; }
  .modal-bg.show{ display:flex; }
  .modal{ background:var(--white); border-radius:var(--radius); padding:22px; width:100%; max-width:400px; }
  .modal h3{ font-size:17px; color:var(--navy); margin-bottom:14px; }
  .modal label{ display:block; font-size:13px; font-weight:700; color:var(--navy); margin:12px 0 5px; }
  .modal input, .modal textarea{ width:100%; padding:10px 11px; font-size:15px; border:1.5px solid var(--lavender); border-radius:8px; font-family:inherit; }
  .modal .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .modal .btn-row button{ flex:1; }
</style>
  <!-- Modern UI layer (loads after inline styles). Remove this line to restore the original design. -->
  <link rel="stylesheet" href="../assets/app.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>
<div class="wrap">
  <header class="brand">
    <div class="region">Greater Accra East Region</div>
    <h1>Officer Dashboard</h1>
  </header>

  <div id="topbar">
    <div>
      <div class="who" id="whoName"></div>
      <div class="title" id="whoTitle"></div>
    </div>
    <div class="user-menu" id="userMenu">
      <button class="user-menu-btn" onclick="toggleUserMenu()">
        <span class="avatar sm c0" id="userAvatar">?</span>
        <span id="userMenuName"></span>
        <i data-lucide="chevron-down"></i>
      </button>
      <div class="user-menu-dd" id="userMenuDD">
        <button onclick="openPinModal()"><i data-lucide="lock"></i>Change PIN</button>
        <hr>
        <button class="danger" onclick="confirmLogout()"><i data-lucide="log-out"></i>Log Out</button>
      </div>
    </div>
  </div>

  <div class="card" id="loginCard">
    <h2>Sign in</h2>
    <label for="officerSelect">Officer</label>
    <select id="officerSelect"></select>
    <label for="pinInput">PIN</label>
    <input id="pinInput" type="password" inputmode="numeric" placeholder="6-digit PIN" />
    <div id="loginError"></div>
    <button class="primary" onclick="login()"><i data-lucide="log-in"></i>Sign In</button>
  </div>

  <div id="dashboard">
    <div class="tabs">
      <button class="tab active" id="tabAppts" onclick="switchTab('appts')"><i data-lucide="calendar"></i>Appointments</button>
      <button class="tab" id="tabQueue" onclick="switchTab('queue')"><i data-lucide="users"></i>Queue<span id="queueBadgeCount"></span></button>
    </div>

    <div id="apptsView">
      <div class="section-title">Needs your action</div>
      <div id="pendingList"></div>

      <div class="section-title">Upcoming</div>
      <div id="upcomingList"></div>

      <div class="section-title">Past</div>
      <div id="pastList"></div>
    </div>

    <div id="queueView" style="display:none">
      <div class="section-title">Conversation with front desk</div>
      <div id="qNotesThread" class="note-thread"></div>
      <div class="note-input-row">
        <input id="qNoteInput" type="text" placeholder="Send a quick note…" />
        <button class="secondary" onclick="sendGeneralNote()"><i data-lucide="send"></i>Send</button>
      </div>

      <div class="section-title">Waiting to see you</div>
      <div id="qWaiting"></div>
      <div class="section-title">Currently with you</div>
      <div id="qCalled"></div>
      <div class="section-title">Held by front desk</div>
      <div id="qHeld"></div>
    </div>
  </div>
</div>

<!-- Dramatic "not ready" alert — must be explicitly dismissed -->
<div class="alert-overlay" id="heldAlert">
  <div class="alert-card">
    <div class="icon"><i data-lucide="pause-circle" style="width:40px;height:40px;color:var(--gold);"></i></div>
    <h2>Front desk: not ready</h2>
    <div class="detail" id="heldAlertDetail"></div>
    <button class="primary" style="margin-top:0" onclick="dismissHeldAlert()"><i data-lucide="phone-off"></i>OK, I'll call someone else</button>
  </div>
</div>

<!-- Per-visitor Note Modal -->
<div class="modal-bg" id="visitorNoteModal">
  <div class="modal">
    <h3>Note — <span id="vnName"></span></h3>
    <div id="vnThread" class="note-thread"></div>
    <div class="note-input-row">
      <input id="vnInput" type="text" placeholder="Write a note about this visitor…" />
      <button class="secondary" onclick="sendVisitorNote()"><i data-lucide="send"></i>Send</button>
    </div>
    <div class="btn-row">
      <button class="secondary" style="width:100%" onclick="closeModal('visitorNoteModal')"><i data-lucide="x"></i>Close</button>
    </div>
  </div>
</div>

<!-- Reschedule Modal -->
<div class="modal-bg" id="rescheduleModal">
  <div class="modal">
    <h3>Reschedule appointment</h3>
    <label>New date</label>
    <input type="date" id="rNewDate" />
    <label>New time</label>
    <input type="time" id="rNewTime" />
    <label>Note (optional)</label>
    <textarea id="rNote" rows="2" placeholder="Reason for rescheduling"></textarea>
    <div id="rescheduleError"></div>
    <div class="btn-row">
      <button class="secondary" onclick="closeModal('rescheduleModal')"><i data-lucide="x"></i>Cancel</button>
      <button class="primary" style="margin-top:0" onclick="confirmReschedule()"><i data-lucide="save"></i>Save</button>
    </div>
  </div>
</div>

<!-- Change PIN Modal -->
<div class="modal-bg" id="pinModal">
  <div class="modal">
    <h3>Change your PIN</h3>
    <label>New PIN (at least 6 digits)</label>
    <input type="password" inputmode="numeric" id="newPin1" />
    <label>Confirm new PIN</label>
    <input type="password" inputmode="numeric" id="newPin2" />
    <div id="pinError"></div>
    <div class="btn-row">
      <button class="secondary" onclick="closeModal('pinModal')"><i data-lucide="x"></i>Cancel</button>
      <button class="primary" style="margin-top:0" onclick="confirmChangePin()"><i data-lucide="save"></i>Save</button>
    </div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://fdcpvocferfjfvwbzhhe.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZkY3B2b2NmZXJmamZ2d2J6aGhlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1MDk0NTgsImV4cCI6MjEwMTA4NTQ1OH0.j_6nhUKOjwesGGHMubgHvHzOg4184pTQ9e9Djnz-KwE';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Fixed email convention set up when the staff logins were created
  const EMAIL_BY_TITLE = {
    'Regional Superintendent': 'rs@aggareast-bookings.internal',
    'Regional Secretary': 'rsec@aggareast-bookings.internal',
    'Regional Treasurer': 'rtreas@aggareast-bookings.internal'
  };

  let officers = [];
  let myProfile = null;
  let rescheduleTargetId = null;

  async function loadOfficersIntoSelect(){
    const { data } = await supabase.from('officers').select('*').eq('active', true).order('sort_order');
    officers = data || [];
    const sel = document.getElementById('officerSelect');
    sel.innerHTML = officers.map(o => `<option value="${o.id}">${o.full_name} — ${o.title}</option>`).join('');
  }

  window.login = async function(){
    const officerId = document.getElementById('officerSelect').value;
    const pin = document.getElementById('pinInput').value.trim();
    const errEl = document.getElementById('loginError');
    const btn = document.querySelector('#loginCard button.primary');
    errEl.innerHTML = '';
    const officer = officers.find(o => o.id === officerId);
    if(!officer || !pin){ errEl.innerHTML = '<div class="error">Please select your name and enter your PIN.</div>'; return; }

    showSpinner(btn);
    const email = EMAIL_BY_TITLE[officer.title];
    const { error } = await supabase.auth.signInWithPassword({ email, password: pin });
    if(error){ hideSpinner(btn); errEl.innerHTML = '<div class="error">Incorrect PIN. Please try again.</div>'; return; }

    await loadDashboard();
  };

  window.logout = async function(){
    await supabase.auth.signOut();
    myProfile = null;
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('topbar').style.display = 'none';
    document.getElementById('loginCard').style.display = 'block';
    document.getElementById('pinInput').value = '';
  };

  window.confirmLogout = async function(){
    if(!await confirm('Log out of the dashboard?')) return;
    await logout();
  };

  window.toggleUserMenu = function(){
    const dd = document.getElementById('userMenuDD');
    dd.classList.toggle('show');
    const close = (e) => {
      if(!document.getElementById('userMenu').contains(e.target)){
        dd.classList.remove('show');
        document.removeEventListener('click', close);
      }
    };
    setTimeout(()=>document.addEventListener('click', close), 0);
  };

  async function loadDashboard(){
    const { data: { user } } = await supabase.auth.getUser();
    if(!user) return;
    const { data: profile } = await supabase.from('profiles').select('*').eq('id', user.id).single();
    if(!profile || profile.role !== 'officer'){
      document.getElementById('loginError').innerHTML = '<div class="error">This login is not set up as an officer account.</div>';
      await supabase.auth.signOut();
      return;
    }
    myProfile = profile;
    const officer = officers.find(o => o.id === profile.officer_id);

    document.getElementById('loginCard').style.display = 'none';
    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('whoName').textContent = officer.full_name;
    document.getElementById('whoTitle').textContent = officer.title;

    const avatarEl = document.getElementById('userAvatar');
    avatarEl.textContent = getInitials(officer.full_name);
    avatarEl.className = `avatar sm ${getAvatarColor(officer.full_name)}`;
    document.getElementById('userMenuName').textContent = officer.full_name.split(' ')[0];

    await renderAppointments();
    await renderQueue();
    subscribeRealtime();
    startNotesPolling();
  }

  window.switchTab = function(tab){
    document.getElementById('tabAppts').classList.toggle('active', tab==='appts');
    document.getElementById('tabQueue').classList.toggle('active', tab==='queue');
    document.getElementById('apptsView').style.display = tab==='appts' ? 'block' : 'none';
    document.getElementById('queueView').style.display = tab==='queue' ? 'block' : 'none';
  };

  // ---------- Attention: sound + browser notification + full-screen alert ----------
  function playChime(urgent){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const freqs = urgent ? [660, 660, 660] : [880, 1108];
      freqs.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.15, ctx.currentTime + i*0.18);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.18 + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i*0.18); osc.stop(ctx.currentTime + i*0.18 + 0.4);
      });
    } catch(e){ /* audio not available, fine */ }
  }
  function notifyBrowser(title, body){
    if('Notification' in window && Notification.permission === 'granted'){
      try { new Notification(title, { body, tag: 'aggareast-queue' }); } catch(e){}
    }
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
  }
  function requestNotifyPermission(){
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
  }
  function showToast(msg){
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  let heldAlertQueue = [];
  function queueHeldAlert(entry){
    heldAlertQueue.push(entry);
    playChime(true);
    notifyBrowser('Front desk: not ready', `${entry.visitor_name} isn't available right now.`);
    if(!document.getElementById('heldAlert').classList.contains('show')) showNextHeldAlert();
  }
  function showNextHeldAlert(){
    if(!heldAlertQueue.length) return;
    const entry = heldAlertQueue[0];
    document.getElementById('heldAlertDetail').textContent =
      `${entry.visitor_name} isn't available right now.` + (entry.held_note ? ` "${entry.held_note}"` : '');
    document.getElementById('heldAlert').classList.add('show');
  }
  window.dismissHeldAlert = function(){
    heldAlertQueue.shift();
    document.getElementById('heldAlert').classList.remove('show');
    setTimeout(showNextHeldAlert, 300);
  };

  // ---------- Realtime: any change to the queue or notes just re-renders ----------
  let realtimeSubscribed = false;
  function subscribeRealtime(){
    if(realtimeSubscribed) return;
    realtimeSubscribed = true;
    requestNotifyPermission();
    supabase.channel('officer-queue')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'queue_entries', filter: `officer_id=eq.${myProfile.officer_id}` }, (payload) => {
        if(payload.new.status === 'held' && payload.old.status !== 'held'){
          queueHeldAlert(payload.new);
        } else if(payload.new.status === 'waiting' && payload.old.status === 'held'){
          playChime(false);
          notifyBrowser('Ready now', `${payload.new.visitor_name} is ready to be seen.`);
          showToast(`${payload.new.visitor_name} is ready now.`);
        }
        renderQueue();
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'queue_entries', filter: `officer_id=eq.${myProfile.officer_id}` }, () => renderQueue())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'queue_notes', filter: `officer_id=eq.${myProfile.officer_id}` }, () => renderNotesThread())
      .subscribe();
  }

  // ---------- Queue ----------
  function fmtWhen(ts){ return new Date(ts).toLocaleTimeString('en-GB', { hour: 'numeric', minute: '2-digit' }); }

  async function renderQueue(){
    const startOfToday = new Date(); startOfToday.setHours(0,0,0,0);
    const { data } = await supabase.from('queue_entries').select('*')
      .eq('officer_id', myProfile.officer_id)
      .gte('checked_in_at', startOfToday.toISOString())
      .in('status', ['waiting','called','held'])
      .order('checked_in_at', { ascending: true });

    const entries = data || [];
    const waiting = entries.filter(e => e.status === 'waiting');
    const called = entries.filter(e => e.status === 'called');
    const held = entries.filter(e => e.status === 'held');

    const badgeEl = document.getElementById('queueBadgeCount');
    const total = entries.length;
    badgeEl.textContent = total ? ` (${total})` : '';

    renderQueueSection('qWaiting', waiting, false);
    renderQueueSection('qCalled', called, true);
    renderQueueSection('qHeld', held, false);
    await renderNotesThread();
  }

  function renderQueueSection(containerId, list, alert){
    const el = document.getElementById(containerId);
    const icons = { qWaiting:'clock', qCalled:'phone-call', qHeld:'pause-circle' };
    const labels = { qWaiting:'Waiting visitors', qCalled:'Ready to see you', qHeld:'On hold' };
    if(!list.length){
      el.innerHTML = `<div class="empty-state"><div class="empty-icon"><i data-lucide="${icons[containerId]||'inbox'}"></i></div><div class="empty-title">${labels[containerId]||'Empty'}</div><div class="empty-desc">Nobody here right now.</div></div>`;
      return;
    }
    el.innerHTML = list.map(e => {
      let btns = '';
      if(e.status === 'waiting'){
        btns += `<button class="secondary" onclick="doCallIn('${e.id}')"><i data-lucide="phone-call"></i>Call In</button>`;
        if(e.appointment_id){
          btns += `<button class="secondary" onclick="openQueueReschedule('${e.id}','${e.appointment_id}')"><i data-lucide="calendar-range"></i>Reschedule</button>`;
        }
        btns += `<button class="danger" onclick="doQueueCancel('${e.id}')"><i data-lucide="x-circle"></i>Cancel</button>`;
      } else if(e.status === 'called'){
        btns += `<button class="secondary" onclick="doQueueDone('${e.id}')"><i data-lucide="check-circle"></i>Mark Done</button>`;
      }
      btns += `<button class="secondary" onclick="openVisitorNote('${e.id}','${e.visitor_name.replace(/'/g,"\\'")}')"><i data-lucide="message-square"></i>Note</button>`;
      const heldNote = e.status === 'held' && e.held_note ? `<div class="purpose">Front desk says: "${e.held_note}"</div>` : '';
      const countdown = e.status === 'waiting' ? `<div class="countdown"><i data-lucide="clock" class="countdown-icon" style="width:12px;height:12px;"></i>${waitingSince(e.checked_in_at)}</div>` : '';
      return `<div class="appt ${alert ? 'queue-alert' : ''}">
        <div class="row1">
          <div style="display:flex;align-items:center;gap:10px;">
            ${avatarHTML(e.visitor_name, 'md')}
            <div class="when">${e.visitor_name}</div>
          </div>
          <div class="badge ${e.status}">${e.status.replace('_',' ')}</div>
        </div>
        <div class="meta">${e.visitor_phone} · ${e.visitor_church || ''} · checked in ${timeAgo(e.checked_in_at)}</div>
        ${countdown}
        ${e.purpose ? `<div class="purpose">${e.purpose}</div>` : ''}
        ${heldNote}
        <div class="btns">${btns}</div>
      </div>`;
    }).join('');
    if(window.lucide) lucide.createIcons();
  }

  window.doCallIn = async (id) => {
    const btn = event.target.closest('button');
    if(btn) showSpinner(btn);
    const { error } = await supabase.rpc('queue_call_in', { p_entry_id: id });
    if(error){ if(btn) hideSpinner(btn); showToast('Could not call them in','error'); }
    else showToast('Visitor called in','success');
  };
  window.doQueueDone = async (id) => {
    const btn = event.target.closest('button');
    if(btn) showSpinner(btn);
    await supabase.rpc('queue_mark_done', { p_entry_id: id });
    showToast('Marked done','success');
  };
  window.doQueueCancel = async (id) => {
    const reason = prompt('Reason for cancelling (optional):') || null;
    await supabase.rpc('queue_cancel', { p_entry_id: id, p_reason: reason });
    showToast('Visitor removed from queue','success');
  };

  let rescheduleQueueEntryId = null;
  window.openQueueReschedule = function(entryId, appointmentId){
    rescheduleTargetId = appointmentId;
    rescheduleQueueEntryId = entryId;
    document.getElementById('rNewDate').value = '';
    document.getElementById('rNewTime').value = '';
    document.getElementById('rNote').value = '';
    document.getElementById('rescheduleError').innerHTML = '';
    document.getElementById('rescheduleModal').classList.add('show');
  };

  // ---------- Notes ----------
  async function renderNotesThread(){
    const el = document.getElementById('qNotesThread');
    if(!el) return;
    const { data, error } = await supabase.from('queue_notes').select('*')
      .eq('officer_id', myProfile.officer_id).is('queue_entry_id', null)
      .order('created_at', { ascending: true }).limit(50);
    if(error){
      el.innerHTML = '<div class="error">Could not load the conversation — <button class="secondary" onclick="renderNotesThread()">Retry</button></div>';
      return;
    }
    el.innerHTML = (data||[]).map(n => `<div class="note-line">${avatarHTML(n.sender_display_name, 'sm')}<div class="note-content"><b>${n.sender_display_name}:</b> ${n.message}</div></div>`).join('') || '<div class="empty-note">No notes yet.</div>';
    el.scrollTop = el.scrollHeight;
  }
  window.renderNotesThread = renderNotesThread;

  function startNotesPolling(){
    setInterval(renderNotesThread, 10000);
  }
  window.sendGeneralNote = async function(){
    const input = document.getElementById('qNoteInput');
    const msg = input.value.trim();
    if(!msg) return;
    input.value = '';
    await supabase.rpc('send_queue_note', { p_officer_id: myProfile.officer_id, p_entry_id: null, p_message: msg });
  };

  let visitorNoteEntryId = null;
  window.openVisitorNote = async function(entryId, name){
    visitorNoteEntryId = entryId;
    document.getElementById('vnName').textContent = name;
    document.getElementById('vnInput').value = '';
    await renderVisitorNoteThread();
    document.getElementById('visitorNoteModal').classList.add('show');
  };
  async function renderVisitorNoteThread(){
    const { data, error } = await supabase.from('queue_notes').select('*')
      .eq('queue_entry_id', visitorNoteEntryId).order('created_at', { ascending: true });
    const el = document.getElementById('vnThread');
    if(error){
      el.innerHTML = '<div class="error">Could not load notes — <button class="secondary" onclick="renderVisitorNoteThread()">Retry</button></div>';
      return;
    }
    el.innerHTML = (data||[]).map(n => `<div class="note-line">${avatarHTML(n.sender_display_name, 'sm')}<div class="note-content"><b>${n.sender_display_name}:</b> ${n.message}</div></div>`).join('') || '<div class="empty-note">No notes yet.</div>';
  }
  window.renderVisitorNoteThread = renderVisitorNoteThread;
  window.sendVisitorNote = async function(){
    const input = document.getElementById('vnInput');
    const msg = input.value.trim();
    if(!msg) return;
    input.value = '';
    await supabase.rpc('send_queue_note', { p_officer_id: myProfile.officer_id, p_entry_id: visitorNoteEntryId, p_message: msg });
    await renderVisitorNoteThread();
  };

  function fmtDate(d){
    return new Date(d + 'T00:00:00').toLocaleDateString('en-GB',{weekday:'short', day:'numeric', month:'short', year:'numeric'});
  }
  function fmtTime(t){
    const [h,m] = t.split(':').map(Number);
    const ampm = h>=12 ? 'PM':'AM';
    const h12 = ((h+11)%12)+1;
    return `${h12}:${m.toString().padStart(2,'0')} ${ampm}`;
  }

  async function renderAppointments(){
    const { data: appts } = await supabase.from('appointments')
      .select('*').eq('officer_id', myProfile.officer_id)
      .order('requested_date', { ascending: true }).order('requested_time', { ascending: true });

    const ids = (appts||[]).map(a=>a.id);
    let latestProxyByAppt = {};
    if(ids.length){
      const { data: logs } = await supabase.from('audit_log')
        .select('*').in('appointment_id', ids).order('created_at', { ascending: false });
      (logs||[]).forEach(l=>{
        if(l.actor_role !== 'officer' && !latestProxyByAppt[l.appointment_id]){
          latestProxyByAppt[l.appointment_id] = l;
        }
      });
    }

    const todayStr = new Date().toISOString().slice(0,10);
    const pending = [], upcoming = [], past = [];
    (appts||[]).forEach(a=>{
      if(a.status === 'pending') pending.push(a);
      else if(a.status === 'cancelled' || a.status === 'completed' || a.requested_date < todayStr) past.push(a);
      else upcoming.push(a);
    });

    renderList('pendingList', pending, latestProxyByAppt, true);
    renderList('upcomingList', upcoming, latestProxyByAppt, true);
    renderList('pastList', past.reverse(), latestProxyByAppt, true);
  }

  function renderList(containerId, list, proxyMap, showActions){
    const el = document.getElementById(containerId);
    if(!list.length){
      const icons = { pendingList:'clock', upcomingList:'calendar-clock', pastList:'calendar-check' };
      const titles = { pendingList:'No pending appointments', upcomingList:'No upcoming appointments', pastList:'No past appointments' };
      el.innerHTML = `<div class="empty-state"><div class="empty-icon"><i data-lucide="${icons[containerId]||'calendar'}"></i></div><div class="empty-title">${titles[containerId]||'No appointments'}</div><div class="empty-desc">Appointments will appear here.</div></div>`;
      return;
    }
    el.innerHTML = list.map(a => {
      const proxy = proxyMap[a.id];
      const proxyTag = proxy ? `<div class="proxy-tag">${proxy.action[0].toUpperCase()+proxy.action.slice(1)} by ${proxy.actor_display_name} (${proxy.actor_role})</div>` : '';
      let btns = '';
      const isFuture = a.requested_date >= new Date().toISOString().slice(0,10);
      if(showActions){
        if(a.status === 'confirmed' && !isFuture){
          btns += `<button class="secondary" onclick="doComplete('${a.id}')"><i data-lucide="check-circle"></i>Mark Completed</button>`;
        }
        if(isFuture && a.status === 'pending'){
          btns += `<button class="secondary" onclick="doConfirm('${a.id}')"><i data-lucide="check"></i>Confirm</button>`;
        }
        if(isFuture && (a.status === 'pending' || a.status === 'confirmed')){
          btns += `<button class="secondary" onclick="openReschedule('${a.id}')"><i data-lucide="calendar-range"></i>Reschedule</button>`;
          btns += `<button class="danger" onclick="doCancel('${a.id}')"><i data-lucide="x-circle"></i>Cancel</button>`;
        }
      }
      return `<div class="appt">
        <div class="row1">
          <div style="display:flex;align-items:center;gap:10px;">
            ${avatarHTML(a.requester_name, 'md')}
            <div>
              <div class="when">${fmtDate(a.requested_date)} · ${fmtTime(a.requested_time.slice(0,5))}</div>
              <div class="who">${a.requester_name}</div>
            </div>
          </div>
          <div class="badge ${a.status}">${a.status}</div>
        </div>
        <div class="meta">${a.requester_phone} · ${a.requester_church}</div>
        ${a.purpose ? `<div class="purpose">${a.purpose}</div>` : ''}
        ${proxyTag}
        ${btns ? `<div class="btns">${btns}</div>` : ''}
      </div>`;
    }).join('');
    if(window.lucide) lucide.createIcons();
  }

  async function notifyStatus(id, kind){
    try { await supabase.functions.invoke('send-status-sms', { body: { appointment_id: id, kind } }); }
    catch(e){ /* notification failure shouldn't block the action */ }
  }

  window.doConfirm = async function(id){
    const btn = event.target.closest('button');
    if(btn) showSpinner(btn);
    const { error } = await supabase.rpc('update_appointment_status', { p_appointment_id: id, p_new_status: 'confirmed', p_note: null });
    if(!error){ await notifyStatus(id, 'confirmed'); await renderAppointments(); showToast('Appointment confirmed','success'); }
    else { if(btn) hideSpinner(btn); showToast('Could not confirm appointment','error'); }
  };
  window.doCancel = async function(id){
    if(!await confirm('Cancel this appointment?')) return;
    const btn = event.target.closest('button');
    if(btn) showSpinner(btn);
    const { error } = await supabase.rpc('update_appointment_status', { p_appointment_id: id, p_new_status: 'cancelled', p_note: null });
    if(!error){ await notifyStatus(id, 'cancelled'); await renderAppointments(); showToast('Appointment cancelled','success'); }
    else { if(btn) hideSpinner(btn); showToast('Could not cancel appointment','error'); }
  };
  window.doComplete = async function(id){
    const btn = event.target.closest('button');
    if(btn) showSpinner(btn);
    const { error } = await supabase.rpc('update_appointment_status', { p_appointment_id: id, p_new_status: 'completed', p_note: null });
    if(!error){ await renderAppointments(); showToast('Marked completed','success'); }
    else { if(btn) hideSpinner(btn); showToast('Could not complete appointment','error'); }
  };

  window.openReschedule = function(id){
    rescheduleTargetId = id;
    rescheduleQueueEntryId = null;
    document.getElementById('rNewDate').value = '';
    document.getElementById('rNewTime').value = '';
    document.getElementById('rNote').value = '';
    document.getElementById('rescheduleError').innerHTML = '';
    document.getElementById('rescheduleModal').classList.add('show');
  };
  window.confirmReschedule = async function(){
    const date = document.getElementById('rNewDate').value;
    const time = document.getElementById('rNewTime').value;
    const note = document.getElementById('rNote').value.trim();
    const errEl = document.getElementById('rescheduleError');
    if(!date || !time){ errEl.innerHTML = '<div class="error">Please choose a new date and time.</div>'; return; }
    const { error } = await supabase.rpc('reschedule_appointment', {
      p_appointment_id: rescheduleTargetId, p_new_date: date, p_new_time: time + ':00', p_note: note || null
    });
    if(error){
      errEl.innerHTML = error.code === '23505'
        ? '<div class="error">That officer already has an appointment at that time.</div>'
        : '<div class="error">Something went wrong. Please try again.</div>';
      return;
    }
    if(rescheduleQueueEntryId){
      await supabase.rpc('queue_cancel', { p_entry_id: rescheduleQueueEntryId, p_reason: 'Rescheduled to a new time — see appointment.' });
      rescheduleQueueEntryId = null;
    }
    closeModal('rescheduleModal');
    await notifyStatus(rescheduleTargetId, 'rescheduled');
    await renderAppointments();
  };

  window.openPinModal = function(){
    document.getElementById('newPin1').value = '';
    document.getElementById('newPin2').value = '';
    document.getElementById('pinError').innerHTML = '';
    document.getElementById('pinModal').classList.add('show');
  };
  window.confirmChangePin = async function(){
    const p1 = document.getElementById('newPin1').value;
    const p2 = document.getElementById('newPin2').value;
    const errEl = document.getElementById('pinError');
    if(p1.length < 6){ errEl.innerHTML = '<div class="error">PIN must be at least 6 characters.</div>'; return; }
    if(p1 !== p2){ errEl.innerHTML = '<div class="error">PINs do not match.</div>'; return; }
    const { error } = await supabase.auth.updateUser({ password: p1 });
    if(error){ errEl.innerHTML = '<div class="error">Could not update PIN. Please try again.</div>'; return; }
    closeModal('pinModal');
    alert('PIN updated.');
  };

  window.closeModal = function(id){ document.getElementById(id).classList.remove('show'); };

  // ============================================================
  // UTILITY FUNCTIONS — Toasts, Avatars, Relative Time, Spinners
  // ============================================================

  window.showToast = function(msg, type='info', duration=3500){
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    const icons = { success:'check-circle', error:'alert-circle', info:'info' };
    el.innerHTML = `<i data-lucide="${icons[type]||'info'}" class="toast-icon" style="width:18px;height:18px;"></i><span class="toast-msg">${msg}</span>`;
    container.appendChild(el);
    if(window.lucide) lucide.createIcons();
    setTimeout(()=>{ el.classList.add('exiting'); setTimeout(()=>el.remove(), 300); }, duration);
  };

  window.alert = function(msg){ showToast(msg, 'info', 4000); };

  window.confirm = function(msg){
    return new Promise(resolve=>{
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      el.className = 'toast info';
      el.style.cursor = 'pointer';
      el.innerHTML = `<i data-lucide="help-circle" class="toast-icon" style="width:18px;height:18px;"></i><span class="toast-msg">${msg} — Tap to confirm</span>`;
      container.appendChild(el);
      if(window.lucide) lucide.createIcons();
      el.onclick = ()=>{ el.classList.add('exiting'); setTimeout(()=>el.remove(), 300); resolve(true); };
      setTimeout(()=>{ el.classList.add('exiting'); setTimeout(()=>el.remove(), 300); resolve(false); }, 6000);
    });
  };

  window.timeAgo = function(ts){
    const diff = Date.now() - new Date(ts).getTime();
    const secs = Math.floor(diff/1000);
    if(secs < 60) return 'just now';
    const mins = Math.floor(secs/60);
    if(mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins/60);
    if(hrs < 24) return `${hrs}h ago`;
    const days = Math.floor(hrs/24);
    return `${days}d ago`;
  };

  window.waitingSince = function(ts){
    const diff = Date.now() - new Date(ts).getTime();
    const mins = Math.floor(diff/60000);
    if(mins < 1) return 'Just arrived';
    if(mins < 60) return `Waiting ${mins}m`;
    const hrs = Math.floor(mins/60);
    return `Waiting ${hrs}h ${mins%60}m`;
  };

  window.getInitials = function(name){
    if(!name) return '?';
    return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  };

  window.getAvatarColor = function(name){
    if(!name) return 'c0';
    let hash = 0;
    for(let i=0;i<name.length;i++) hash = name.charCodeAt(i)+((hash<<5)-hash);
    return 'c'+(Math.abs(hash)%8);
  };

  window.showSpinner = function(btn){
    btn.dataset.origText = btn.innerHTML;
    btn.disabled = true;
    const text = btn.textContent.trim();
    btn.innerHTML = `<span class="btn-spinner"></span>${text}`;
    if(window.lucide) lucide.createIcons();
  };
  window.hideSpinner = function(btn){
    btn.disabled = false;
    if(btn.dataset.origText) btn.innerHTML = btn.dataset.origText;
    if(window.lucide) lucide.createIcons();
  };

  window.avatarHTML = function(name, size='sm'){
    const initials = getInitials(name);
    const color = getAvatarColor(name);
    return `<span class="avatar ${size} ${color}">${initials}</span>`;
  };

  async function init(){
    await loadOfficersIntoSelect();
    const { data: { session } } = await supabase.auth.getSession();
    if(session) await loadDashboard();
    if(window.lucide) lucide.createIcons();
  }
  init();
  document.addEventListener('DOMContentLoaded', ()=>{ if(window.lucide) lucide.createIcons(); });
</script>
</body>
